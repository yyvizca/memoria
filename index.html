<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f5f6f2">
    <title>MEMORIA | Sympathy Chapel and Memorial Park</title>
    <style>
        :root {
            --bg: #f5f6f2;
            --paper: #fff;
            --ink: #202923;
            --muted: #7d8980;
            --line: #e7ebe5;
            --green: #3f6b53;
            --deep: #294734;
            --sage: #eaf1e9;
            --gold: #b9915c;
            --red: #bd655b;
            --nav: #20372b;
            --nav2: #314e3c;
            --shadow: 0 8px 26px rgba(31, 54, 40, .045);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-width: 320px;
            background: var(--bg);
            color: var(--ink);
            font-size: 13px
        }

        button,
        input,
        select,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #a5c1ac;
            outline-offset: 1px
        }

        svg {
            width: 18px;
            height: 18px;
            vertical-align: middle
        }

        .hidden {
            display: none !important
        }

        .login-screen {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.06fr .94fr;
            background: var(--paper)
        }

        .login-visual {
            position: relative;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 44px 7vw;
            background: radial-gradient(ellipse at 80% 80%, #496951 0, transparent 42%), linear-gradient(145deg, #20372b, #17291f);
            color: white
        }

        .login-visual:after {
            position: absolute;
            right: -140px;
            bottom: -220px;
            width: 570px;
            height: 570px;
            border: 1px solid #ffffff20;
            border-radius: 50%;
            content: "";
            box-shadow: 0 0 0 46px #ffffff09, 0 0 0 92px #ffffff06
        }

        .wordmark {
            display: flex;
            align-items: center;
            gap: 13px
        }

        .brand-symbol {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            border: 1px solid #adbea8;
            border-radius: 50%;
            color: #e7d6b7
        }

        .brand-symbol svg {
            width: 25px;
            height: 25px
        }

        .wordmark b {
            font-family: Georgia, serif;
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 2.8px
        }

        .wordmark small {
            display: block;
            margin-top: 4px;
            color: #aebdaf;
            font-size: 9px;
            letter-spacing: 1.7px;
            text-transform: uppercase
        }

        .login-copy {
            position: relative;
            z-index: 1;
            max-width: 510px;
            padding-bottom: 46px
        }

        .login-copy .kicker {
            color: #d5c29f;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase
        }

        .login-copy h1 {
            margin: 18px 0 15px;
            font-family: Georgia, serif;
            font-size: clamp(38px, 5.2vw, 65px);
            font-weight: 400;
            line-height: 1.06
        }

        .login-copy p {
            max-width: 420px;
            color: #bfcbc1;
            font-size: 14px;
            line-height: 1.8
        }

        .login-location {
            position: relative;
            z-index: 1;
            color: #aebdaf;
            font-size: 11px
        }

        .login-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 25px
        }

        .login-box {
            width: min(100%, 400px)
        }

        .login-box h2 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 31px;
            font-weight: 400
        }

        .login-box>p {
            margin: 9px 0 27px;
            color: var(--muted);
            font-size: 12px
        }

        .field {
            display: grid;
            gap: 7px;
            margin: 0 0 16px
        }

        .field label {
            color: #4f5c53;
            font-size: 11px;
            font-weight: 650
        }

        .control {
            width: 100%;
            min-height: 40px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: white;
            color: var(--ink)
        }

        textarea.control {
            min-height: 78px;
            resize: vertical
        }

        .password-wrap {
            position: relative
        }

        .password-wrap input {
            padding-right: 60px
        }

        .show-password {
            position: absolute;
            top: 50%;
            right: 8px;
            border: 0;
            background: transparent;
            color: var(--green);
            font-size: 10px;
            transform: translateY(-50%)
        }

        .login-error {
            margin: 0 0 14px;
            padding: 10px 12px;
            border: 1px solid #f1d6d3;
            border-radius: 6px;
            background: #fff4f2;
            color: #9b4740;
            font-size: 11px
        }

        .btn {
            display: inline-flex;
            min-height: 37px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 13px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: white;
            color: #47554a;
            font-size: 11px;
            font-weight: 650;
            transition: .16s
        }

        .btn:hover {
            background: #f5f8f4
        }

        .btn.primary {
            border-color: var(--green);
            background: var(--green);
            color: white
        }

        .btn.primary:hover {
            background: var(--deep)
        }

        .btn.danger {
            border-color: #f0d9d6;
            color: #a14c45
        }

        .btn.soft {
            border-color: #dbe7db;
            background: #f5f9f4;
            color: var(--green)
        }

        .btn.full {
            width: 100%;
            min-height: 42px;
            margin-top: 4px
        }

        .btn.small {
            min-height: 29px;
            padding: 0 9px;
            font-size: 10px
        }

        .demo {
            margin-top: 23px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fafbf9
        }

        .demo strong {
            display: block;
            margin-bottom: 8px;
            font-size: 10px
        }

        .demo-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .demo button {
            padding: 6px 8px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: white;
            color: #657168;
            font-size: 9px
        }

        .shell {
            min-height: 100vh
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            z-index: 6;
            display: flex;
            width: 250px;
            flex-direction: column;
            padding: 20px 14px 14px;
            background: var(--nav);
            color: white;
            transition: transform .2s
        }

        .sidebar .wordmark {
            padding: 3px 10px 21px
        }

        .sidebar .wordmark b {
            font-size: 19px
        }

        .sidebar .brand-symbol {
            width: 37px;
            height: 37px
        }

        .sidebar .brand-symbol svg {
            width: 21px
        }

        .side-meta {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0 3px 16px;
            padding: 11px;
            border: 1px solid #ffffff17;
            border-radius: 7px
        }

        .avatar {
            display: grid;
            width: 32px;
            height: 32px;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 50%;
            background: #dce8dc;
            color: var(--deep);
            font-size: 10px;
            font-weight: 700
        }

        .side-meta b {
            display: block;
            font-size: 10px
        }

        .side-meta small {
            display: block;
            margin-top: 3px;
            color: #a8b8aa;
            font-size: 9px
        }

        .nav-caption {
            padding: 7px 10px;
            color: #819589;
            font-size: 9px;
            font-weight: 750;
            letter-spacing: 1.2px;
            text-transform: uppercase
        }

        .nav {
            display: grid;
            gap: 2px;
            overflow: auto;
            scrollbar-width: thin
        }

        .nav button {
            display: flex;
            min-height: 35px;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            border: 0;
            border-radius: 5px;
            background: transparent;
            color: #bac6bd;
            text-align: left;
            font-size: 10px
        }

        .nav button:hover,
        .nav button.active {
            background: var(--nav2);
            color: white
        }

        .nav button svg {
            width: 15px;
            height: 15px
        }

        .nav-foot {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid #ffffff18
        }

        .nav-foot button {
            width: 100%
        }

        .main {
            min-height: 100vh;
            margin-left: 250px
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 4;
            display: flex;
            height: 60px;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid var(--line);
            background: #ffffffed;
            backdrop-filter: blur(8px)
        }

        .crumb {
            color: var(--muted);
            font-size: 10px
        }

        .crumb b {
            color: var(--ink)
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 13px
        }

        .top-right small {
            color: var(--muted);
            font-size: 10px
        }

        .icon-btn {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: white;
            color: #536057
        }

        .menu-toggle {
            display: none
        }

        .page {
            max-width: 1500px;
            margin: auto;
            padding: 27px 30px 48px
        }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px
        }

        .eyebrow {
            margin-bottom: 6px;
            color: var(--green);
            font-size: 9px;
            font-weight: 750;
            letter-spacing: 1.3px;
            text-transform: uppercase
        }

        .page-head h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 30px;
            font-weight: 400;
            letter-spacing: -.3px
        }

        .page-head p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 11px
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .grid {
            display: grid;
            gap: 13px
        }

        .stats {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            margin-bottom: 14px
        }

        .stat {
            min-height: 94px;
            padding: 14px 15px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: white;
            box-shadow: var(--shadow)
        }

        .stat label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--muted);
            font-size: 10px
        }

        .stat-icon {
            display: grid;
            width: 26px;
            height: 26px;
            place-items: center;
            border-radius: 6px;
            background: var(--sage);
            color: var(--green)
        }

        .stat-icon svg {
            width: 14px;
            height: 14px
        }

        .stat strong {
            display: block;
            margin-top: 8px;
            font-family: Georgia, serif;
            font-size: 24px;
            font-weight: 400
        }

        .stat em {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 9px;
            font-style: normal
        }

        .columns {
            grid-template-columns: minmax(0, 1.45fr) minmax(230px, .85fr)
        }

        .columns.two {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .columns.three {
            grid-template-columns: repeat(3, minmax(0, 1fr))
        }

        .panel {
            margin-bottom: 14px;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: white;
            box-shadow: var(--shadow)
        }

        .panel-head {
            display: flex;
            min-height: 54px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 15px;
            border-bottom: 1px solid var(--line)
        }

        .panel-head h2 {
            margin: 0;
            font-size: 12px;
            font-weight: 700
        }

        .panel-head p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 9px
        }

        .panel-body {
            padding: 15px
        }

        .chart {
            width: 100%;
            height: 170px
        }

        .chart text {
            fill: #909a92;
            font-size: 9px
        }

        .chart line.gridline {
            stroke: #edf0eb;
            stroke-width: 1
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            color: var(--muted);
            font-size: 9px
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 5px
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green)
        }

        .dot.gold {
            background: var(--gold)
        }

        .dot.gray {
            background: #dbe3d8
        }

        .ring-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 7px
        }

        .ring {
            display: grid;
            width: 112px;
            height: 112px;
            place-items: center;
            border-radius: 50%;
            background: conic-gradient(var(--green) 0 68%, #dfe8dc 68% 89%, #c69a5d 89% 100%);
            position: relative
        }

        .ring:before {
            position: absolute;
            width: 77px;
            height: 77px;
            border-radius: 50%;
            background: white;
            content: ""
        }

        .ring b {
            z-index: 1;
            font-family: Georgia, serif;
            font-size: 21px;
            font-weight: 400
        }

        .legend-list {
            display: grid;
            gap: 10px
        }

        .legend-list span {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #627066;
            font-size: 10px
        }

        .legend-list b {
            margin-left: auto;
            color: var(--ink)
        }

        .subsection {
            margin: 17px 0 9px;
            font-size: 11px;
            font-weight: 700
        }

        .table-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 9px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--line)
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 7px
        }

        .searchbox {
            position: relative
        }

        .searchbox svg {
            position: absolute;
            top: 50%;
            left: 9px;
            width: 13px;
            height: 13px;
            color: #89948c;
            transform: translateY(-50%)
        }

        .searchbox input {
            width: 190px;
            height: 32px;
            padding: 0 9px 0 28px;
            border: 1px solid var(--line);
            border-radius: 5px;
            font-size: 10px
        }

        .filter {
            height: 32px;
            padding: 0 8px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: white;
            color: #56645a;
            font-size: 10px
        }

        .table-wrap {
            overflow: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap
        }

        th {
            padding: 10px 13px;
            background: #fafbf9;
            color: #849087;
            font-size: 8px;
            font-weight: 750;
            letter-spacing: .65px;
            text-transform: uppercase
        }

        td {
            padding: 10px 13px;
            border-top: 1px solid #eff1ed;
            color: #5c685f;
            font-size: 10px
        }

        tbody tr:hover {
            background: #fbfcfa
        }

        .person {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ink);
            font-weight: 650
        }

        .person .avatar {
            width: 27px;
            height: 27px;
            font-size: 8px
        }

        .secondary {
            display: block;
            margin-top: 3px;
            color: #929c94;
            font-size: 9px;
            font-weight: 400
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 7px;
            border-radius: 30px;
            background: #eaf2ea;
            color: #4d7656;
            font-size: 9px
        }

        .badge:before {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            content: ""
        }

        .badge.reserved,
        .badge.ongoing {
            background: #f8f0e4;
            color: #9a753e
        }

        .badge.pending,
        .badge.inactive,
        .badge.cancelled {
            background: #f8edeb;
            color: #a55951
        }

        .badge.completed {
            background: #eaf2ea;
            color: #4d7656
        }

        .row-actions {
            display: flex;
            gap: 5px
        }

        .link-btn {
            padding: 0;
            border: 0;
            background: none;
            color: var(--green);
            font-size: 10px;
            font-weight: 650
        }

        .empty {
            padding: 28px !important;
            color: var(--muted);
            text-align: center;
            font-size: 11px
        }

        .notice {
            margin: 0 0 13px;
            padding: 10px 12px;
            border: 1px solid #e6ebe3;
            border-radius: 6px;
            background: #f9fbf8;
            color: #637066;
            font-size: 10px;
            line-height: 1.6
        }

        .notice.warn {
            border-color: #f0e3cb;
            background: #fffaf1;
            color: #896b3f
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px
        }

        .quick-actions button {
            min-height: 46px;
            justify-content: flex-start
        }

        .quick-actions svg {
            width: 15px
        }

        .timeline {
            display: grid
        }

        .timeline-row {
            display: grid;
            grid-template-columns: 66px 1fr;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f2ee
        }

        .timeline-row:last-child {
            border: 0
        }

        .timeline-row time {
            color: var(--muted);
            font-size: 9px
        }

        .timeline-row b {
            display: block;
            font-size: 10px
        }

        .timeline-row small {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 9px
        }

        .map-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.65fr) minmax(235px, .7fr);
            gap: 13px
        }

        .map-canvas {
            position: relative;
            min-height: 460px;
            overflow: hidden;
            border: 1px solid #dfe8dc;
            border-radius: 7px;
            background-color: #f1f5ed;
            background-image: linear-gradient(35deg, transparent 48%, #d9e4d5 49%, #d9e4d5 51%, transparent 52%), linear-gradient(145deg, transparent 48%, #d9e4d5 49%, #d9e4d5 51%, transparent 52%);
            background-size: 120px 100px, 160px 140px
        }

        .map-loading {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            background: #f1f5eddf;
            color: var(--green);
            font-size: 11px;
            font-weight: 650
        }

        .map-inner {
            position: absolute;
            inset: 25px 24px 22px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 24px
        }

        .section-zone {
            position: relative;
            display: grid;
            grid-template-columns: repeat(5, minmax(18px, 1fr));
            grid-template-rows: repeat(3, minmax(22px, 1fr));
            gap: 5px;
            padding: 20px 7px 7px;
            border: 1px dashed #a8bca7;
            border-radius: 10px;
            background: #e3ecdfd9
        }

        .section-zone:before {
            position: absolute;
            top: 6px;
            left: 9px;
            color: #6f846e;
            font-size: 9px;
            font-weight: 750;
            letter-spacing: .7px;
            content: attr(data-section)
        }

        .plot-tile {
            display: grid;
            min-height: 22px;
            place-items: center;
            border: 1px solid #b4cab2;
            border-radius: 3px;
            background: #f8fbf5;
            color: #557052;
            font-size: 8px;
            transition: .13s
        }

        .plot-tile:hover,
        .plot-tile.selected {
            outline: 2px solid #263e2d;
            outline-offset: 1px;
            transform: scale(1.04)
        }

        .plot-tile.occupied {
            border-color: #9fb69f;
            background: #709274;
            color: white
        }

        .plot-tile.reserved {
            border-color: #d4b477;
            background: #ead7b2;
            color: #68512d
        }

        .map-path {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 18px;
            background: #fffefa;
            transform: rotate(-12deg)
        }

        .map-key {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 11px 2px 0;
            color: var(--muted);
            font-size: 9px
        }

        .map-key span {
            display: flex;
            align-items: center;
            gap: 5px
        }

        .map-detail {
            position: sticky;
            top: 78px
        }

        .map-detail h3 {
            margin: 0 0 4px;
            font-family: Georgia, serif;
            font-size: 19px;
            font-weight: 400
        }

        .detail-line {
            padding: 10px 0;
            border-bottom: 1px solid var(--line)

        .detail-line small {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);

            display: block;
            font-size: 11px
        }

        .chat-head small {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 9px
        }

        .chat-history {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 12px;
            overflow: auto;
            padding: 16px;
            background: #fbfcfa

        .message {
            max-width: 82%;
            padding: 10px 12px;
            border-radius: 9px;
            background: white;
            box-shadow: 0 1px 5px #20372b0b;
            color: #435147;
            font-size: 10px;
            line-height: 1.65
        }

        .message.user {
            align-self: flex-end;
            background: var(--green);
            color: white
        }

        .message time {
            display: block;
            margin-top: 5px;
            opacity: .65;
            font-size: 8px
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 14px 0
        }

        .suggestions button {
            padding: 6px 8px;
            border: 1px solid #dfe8df;
            border-radius: 20px;
            background: white;
            color: var(--green);
            font-size: 9px
        }

        .chat-compose {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--line)
        }

        .chat-compose input {
            flex: 1;
            min-width: 0;
            height: 37px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 5px;
            font-size: 10px
        }

        .chat-note {
            padding: 0 14px 10px;
            color: var(--muted);
            font-size: 8px
        }

        .prediction-banner {
            padding: 12px 14px;
            border: 1px solid #ebdfc7;
            border-radius: 6px;
            background: #fffaf0;
            color: #80653b;
            font-size: 10px;
            line-height: 1.6
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px
        }

        .metric {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: white
        }

        .metric small {
            color: var(--muted);
            font-size: 9px
        }

        .metric b {
            display: block;
            margin-top: 5px;
            font-family: Georgia, serif;
            font-size: 22px;
            font-weight: 400
        }

        .public-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px max(20px, calc((100% - 1180px)/2));
            border-bottom: 1px solid var(--line);
            background: white
        }

        .public-nav .wordmark b {
            color: var(--deep)
        }

        .public-nav .wordmark small {
            color: var(--muted)
        }

        .public-nav-links {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .public-hero {
            position: relative;
            overflow: hidden;
            padding: 70px 22px 65px;
            background: linear-gradient(105deg, #20372bed, #294734e8), radial-gradient(ellipse at 80% 50%, #65846c, #20372b);
            color: white
        }

        .public-hero-inner {
            max-width: 1180px;
            margin: auto
        }

        .public-hero .eyebrow {
            color: #dbc69f
        }

        .public-hero h1 {
            max-width: 740px;
            margin: 12px 0;
            font-family: Georgia, serif;
            font-size: clamp(35px, 5.2vw, 58px);

            line-height: 1.08

        .public-hero p {
            max-width: 580px;
            color: #c2cec3;
            font-size: 12px;
            line-height: 1.8
        }

        .public-search {

            gap: 7px;
            margin-top: 21px
        }

        .public-search input {
            flex: 1;
            min-width: 0;
            height: 43px;
            padding: 0 13px;
            border: 0;
            border-radius: 5px

        .public-body {
            max-width: 1180px;
            margin: auto;
            padding: 28px 20px 55px
        }

        .public-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px
        }

        .public-card {
            padding: 19px;
            border: 1px solid var(--line);
            border-radius: 7px;
            background: white
        }

        .public-card .stat-icon {
            margin-bottom: 12px
        }

        .public-card h3 {
            margin: 0 0 7px;
            font-size: 12px
        }

        .public-card p {
            margin: 0;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.65
        }

        .public-footer {
            padding: 19px;
            text-align: center;
            color: var(--muted);
            font-size: 9px
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 15;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: #15231ab0
        }

        .modal-backdrop.open {
            display: flex
        }

        .modal {
            width: min(100%, 560px);
            max-height: 90vh;
            overflow: auto;
            padding: 21px;
            border-radius: 9px;
            background: white;
            box-shadow: 0 20px 65px #0003
        }

        .modal-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 17px
        }

        .modal-head h2 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 23px;
            font-weight: 400
        }

        .modal-head p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 10px
        }

        .close {
            width: 29px;
            height: 29px;
            border: 0;
            border-radius: 5px;
            background: #f2f5f1;
            color: #617067;
            font-size: 18px
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 12px
        }

        .form-grid .full {
            grid-column: 1/-1
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            margin-top: 6px
        }

        .confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            margin-top: 18px
        }

        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 25;
            max-width: min(390px, calc(100vw - 40px));
            padding: 11px 14px;
            border-radius: 6px;
            background: var(--nav);
            color: white;
            font-size: 10px;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transform: translateY(7px);
            transition: .2s
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0)
        }

        .restricted {
            max-width: 540px;
            margin: 60px auto;
            padding: 34px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: white;
            text-align: center
        }

        .restricted .stat-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 14px
        }

        .restricted h2 {
            font-family: Georgia, serif;
            font-size: 25px;
            font-weight: 400
        }

        .restricted p {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.7
        }

        .footer-note {
            padding: 14px;
            color: var(--muted);
            font-size: 9px
        }

        @media(max-width:1100px) {
            .sidebar {
                width: 220px
            }

            .main {
                margin-left: 220px
            }

            .page {
                padding-right: 20px;
                padding-left: 20px
            }

            .topbar {
                padding: 0 20px
            }

            .stats {
                grid-template-columns: repeat(3, 1fr)
            }

            .columns.three {
                grid-template-columns: repeat(2, 1fr)
            }
        }

        @media(max-width:760px) {

                grid-template-columns: 1fr
            }

            .login-visual {
                min-height: 250px;
                padding: 24px 24px 16px
            }

            .login-copy {
                padding: 40px 0 7px
            }

            .login-copy h1 {
                font-size: 39px
            }

            .login-location {
                font-size: 9px
            }

            .login-panel {
                padding: 30px 22px
            }

            .sidebar {
                width: 250px;
                transform: translateX(-100%)
            }

            .sidebar.open {
                transform: translateX(0)
            }

            .main {
                margin-left: 0
            }

            .menu-toggle {
                display: grid
            }

            .topbar {
                height: 54px;
                padding: 0 14px
            }

            .page {
                padding: 22px 14px 40px
            }

            .page-head {
                align-items: flex-start;
                flex-direction: column
            }

            .page-head h1 {
                font-size: 27px
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px
            }

            .columns,
            .columns.two,
            .columns.three,
            .map-layout {
                grid-template-columns: 1fr
            }

            .map-detail {
                position: static
            }

            .map-canvas {
                min-height: 410px
            }

            .metric-grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .public-nav {
                padding: 12px 16px
            }

            .public-nav-links {
                gap: 2px
            }

            .public-nav-links .btn {
                padding: 0 8px;
                font-size: 9px
            }

            .public-hero {
                padding: 48px 18px
            }

            .public-cards {
                grid-template-columns: 1fr
            }

            .table-toolbar {
                align-items: flex-start;
                flex-direction: column
            }

            .toolbar-group {
                width: 100%
            }

            .searchbox {
                flex: 1
            }

            .searchbox input {
                width: 100%
            }

            .top-right small {
                display: none
            }
        }

        @media(max-width:450px) {
            .public-nav {
                flex-wrap: wrap;
                gap: 8px;
                padding: 10px 12px
            }

            .public-nav-links {
                width: 100%;
                justify-content: space-between;
                gap: 2px
            }

            .public-nav-links .desktop-link {
                display: inline-flex !important;
                min-height: 28px;
                padding: 0 4px;
                font-size: 8px
            }

            .public-nav .btn.primary {
                min-height: 28px;
                padding: 0 6px;
                font-size: 8px
            }

            .public-nav .wordmark b {
                font-size: 17px
            }

            .public-nav .brand-symbol {
                width: 35px;
                height: 35px
            }

            .ring-row {
                gap: 12px
            }

            .ring {
                width: 98px;
                height: 98px
            }

            .ring:before {
                width: 67px;
                height: 67px
            }

            .map-inner {
                inset: 22px 14px;
                gap: 14px
            }

            .section-zone {
                grid-template-columns: repeat(4, minmax(15px, 1fr));
                grid-template-rows: repeat(4, minmax(17px, 1fr));
                gap: 3px;
                padding: 19px 5px 5px
            }

            .plot-tile {
                min-height: 18px;
                font-size: 7px
            }

            .map-canvas {
                min-height: 360px
            }
        }

        .map-canvas {
            min-height: 520px;
            border: 1px solid #cfdccc;
            border-radius: 9px;
            background-color: #eef3e9;
            background-image: linear-gradient(90deg, transparent 0 49.5%, #dfe8dc 49.5% 50.5%, transparent 50.5%), linear-gradient(0deg, #e2eadf 1px, transparent 1px);
            background-size: 100% 100%, 100% 52px
        }

        .map-inner {
            inset: 24px;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: repeat(4, minmax(92px, 1fr));
            gap: 11px;
            overflow: auto;
            padding: 2px
        }

        .section-zone {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 82px minmax(0, 1fr);
            grid-template-rows: 1fr;
            gap: 8px;
            min-height: 94px;
            padding: 23px 10px 9px;
            border: 1px solid #c7d5c2;
            border-radius: 8px;
            background: #e7efe2eb;
            box-shadow: 0 2px 5px #36553a0b
        }

        .section-zone:before {
            top: 7px;
            left: 11px;
            padding: 3px 7px;
            border-radius: 3px;
            background: #d7e4d2;
            color: #4f684e;
            letter-spacing: .8px
        }

        .plot-bank {
            display: grid;
            grid-template-columns: repeat(3, minmax(25px, 1fr));
            grid-auto-rows: minmax(23px, 1fr);
            align-content: center;
            gap: 5px;
            min-width: 0
        }

        .center-aisle {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-right: 1px dashed #c7c5ae;
            border-left: 1px dashed #c7c5ae;
            background: repeating-linear-gradient(0deg, #f9f7ef 0 15px, #f0eee5 15px 30px);
            color: #86836f;
            font-size: 8px;
            font-weight: 750;
            letter-spacing: 1.4px;
            writing-mode: vertical-rl
        }

        .center-aisle:after {
            position: absolute;
            top: 8px;
            bottom: 8px;
            left: 50%;
            border-left: 1px dashed #b5b19c;
            content: ""
        }

        .plot-tile {
            min-height: 23px;
            border: 1px solid #aec2a9;
            border-radius: 4px;
            background: #f8fbf5;
            color: #506c4f;
            font-size: 8px;
            box-shadow: 0 1px 2px #243c2910
        }

        .plot-tile.occupied {
            border-color: #64856a;
            background: #6f9274;
            color: white
        }

        .plot-tile.reserved {
            border-color: #c6a873;
            background: #e6d2a9;
            color: #68512d
        }

        .map-key {
            gap: 15px;
            padding-top: 13px
        }

        .map-key span:last-child {
            margin-left: auto;
            color: #718071
        }

        @media(max-width:760px) {
            .map-canvas {
                min-height: 500px
            }

            .section-zone {
                grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
                gap: 5px;
                padding: 22px 6px 7px
            }

            .plot-bank {
                grid-template-columns: repeat(2, minmax(21px, 1fr));
                gap: 4px
            }

            .center-aisle {
                font-size: 7px
            }
        }

        @media(max-width:450px) {
            .map-inner {
                inset: 17px 8px;
                gap: 8px
            }

            .section-zone {
                grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr);
                gap: 3px;
                padding: 21px 5px 6px
            }

            .plot-bank {
                grid-template-columns: repeat(2, minmax(18px, 1fr));
                grid-auto-rows: minmax(19px, 1fr);
                gap: 3px
            }

            .plot-tile {
                min-height: 19px;
                font-size: 7px
            }

            .center-aisle {
                font-size: 6px;
                letter-spacing: .8px
            }

            .map-canvas {
                min-height: 420px
            }
        }

        .public-hero-inner {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(290px, .75fr);
            gap: 36px;
            align-items: center
        }

        .bulletin {
            padding: 16px;
            border: 1px solid #ffffff2b;
            border-radius: 10px;
            background: #ffffff14;
            color: white
        }

        .bulletin-head {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ffffff22
        }

        .bulletin-head b {
            display: block;
            font-family: Georgia, serif;
            font-size: 16px;
            font-weight: 400
        }

        .bulletin-head small {
            display: block;
            margin-top: 3px;
            color: #aebdaf;
            font-size: 9px
        }

        .bulletin-list {
            display: grid;
            gap: 10px;
            max-height: 330px;
            overflow: auto;
            padding-top: 12px
        }

        .bulletin-item {
            padding: 11px 12px;
            border-left: 3px solid var(--gold);
            border-radius: 7px;
            background: #ffffff12
        }

        .bulletin-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px
        }

        .bulletin-tag {
            color: #dbc69f;
            font-size: 8px;
            font-weight: 750;
            letter-spacing: 1px;
            text-transform: uppercase
        }

        .bulletin-meta time {
            color: #aebdaf;
            font-size: 9px
        }

        .bulletin-item h3 {
            margin: 0 0 5px;
            font-size: 11px
        }

        .bulletin-item p {
            margin: 0;
            color: #c2cec3;
            font-size: 10px;
            line-height: 1.6
        }

        @media(max-width:900px) {
            .public-hero-inner {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

            function chatbot() { return `${head("Cemetery Information Assistant", "Ask about services, grave searches, plot information, and visitor procedures.")}<div class="grid columns"><section class="panel chat"><div class="chat-head"><span class="avatar">${icons.chat}</span><div><b>MEMORIA assistant</b><small>Configured cemetery information · Read only</small></div><button class="btn small" id="clearChat" style="margin-left:auto">Clear chat</button></div><div class="chat-history" id="chatHistory">${state.chat.map(m => `<div class="message ${m.from === "user" ? "user" : ""}">${esc(m.text)}<time>${m.from === "user" ? "You" : "MEMORIA"} · ${m.time || "Now"}</time></div>`).join("")}${state.chatLoading ? `<div class="message" id="typing">Looking through configured cemetery information…</div>` : ""}</div><div class="suggestions">${["How do I find a grave?", "What are the cemetery hours?", "How do reservations work?", "Where is the cemetery?"].map(q => `<button data-suggestion="${esc(q)}">${esc(q)}</button>`).join("")}</div><form class="chat-compose" id="chatForm"><input id="chatInput" placeholder="Ask a cemetery-related question..." aria-label="Message MEMORIA"><button class="btn primary">Send</button></form><div class="chat-note">MEMORIA answers only from the sample records and configured cemetery information. It cannot change records.</div></section><aside class="panel"><div class="panel-head"><div><h2>Supported information</h2><p>What this assistant can help with</p></div></div><div class="panel-body"><div class="timeline"><div class="timeline-row"><span>${icons.search}</span><div><b>Grave search</b><small>Find sample deceased records by name.</small></div></div><div class="timeline-row"><span>${icons.plot}</span><div><b>Plot information</b><small>Learn plot statuses and sections.</small></div></div><div class="timeline-row"><span>${icons.burial}</span><div><b>Cemetery procedures</b><small>General visiting and reservation information.</small></div></div><div clas             function publicHome() { return `${publicHeader()}<section class="public-hero"><div class="public-hero-inner"><div class="hero-copy"><div class="eyebrow">A place to remember</div><h1>Honoring lives.<br>Keeping memories close.</h1><p>${esc(cemetery)} is here to help families find comfort, care, and connection. Search memorial records or explore the cemetery grounds.</p><form class="public-search" id="publicSearch"><input id="publicQuery" placeholder="Search a loved one's full name..." aria-label="Search a loved one's full name"><button class="btn primary">Search grave ${icons.search}</button></form></div>${bulletinBoard()}</div></section><section class="public-body"><div class="eyebrow">Public services</div><h2 style="font-family:Georgia,serif;font-size:25px;font-weight:400">How can we help?</h2><div class="public-cards"><button class="public-card" data-page="graveSearch" style="text-align:left;cursor:pointer"><span class="stat-icon">${icons.search}</span><h3>Find a grave</h3><p>Search cemetery records and view grave location details.</p></button><button class="public-card" data-page="map" style="text-align:left;cursor:pointer"><span class="stat-icon">${icons.map}</span><h3>Explore the cemetery map</h3><p>Browse sections and locate a plot with the visual map.</p></button><button class="public-card" data-page="chatbot" style="text-align:left;cursor:pointer"><span class="stat-icon">${icons.chat}</span><h3>Ask MEMORIA</h3><p>Get answers about cemetery services and visitor information.</p></button></div><div class="grid columns two" style="margin-top:16px"><article class="panel"><div class="panel-body"><div class="eyebrow">Visit us</div><h3 style="margin:0 0 8px;font-family:Georgia,serif;font-size:19px;font-weight:400">${esc(cemetery)}</h3><p style="color:var(--muted);font-size:10px">${esc(location)}</p><p style="color:var(--muted);font-size:10px">Public visiting hours: 8:00 AM–5:00 PM daily</p></div></article><article class="panel"><div class="panel-body"><di                 document.getElementById("profileLogout")?.addEventListener("click", logout); document.getElementById("printReport")?.addEventListener("click", () => window.print()); document.getElementById("exportReport")?.addEventListener("click", exportReport);
                document.getElementById("reportType")?.addEventListener("change", applyReportFilters); document.getElementById("reportFrom")?.addEventListener("change", applyReportFilters); document.getElementById("reportTo")?.addEventListener("change", applyReportFilters); document.getElementById("reportSearch")?.addEventListener("input", applyReportFilters);
                document.getElementById("predictionPeriod")?.addEventListener("change", () => toast("Estimate period updated. Sample projection is illustrative."));
                document.getElementById("runPrediction")?.addEventListener("click", e => { const button = e.currentTarget, status = document.getElementById("predictionState"); button.disabled = true; button.textContent = "Processing estimate…"; status.classList.remove("hidden"); status.textContent = "Processing sample historical occupancy records…"; setTimeout(() => { button.disabled = false; button.innerHTML = `${icons.predict} Run estimate`; status.textContent = "Prediction unavailable for live cemetery records. This preview has no connected prediction engine; the chart above is illustrative sample data only." }, 650) });
            }
            function sendChat(text) { const input = document.getElementById("chatInput"); const value = (text ?? input?.value ?? "").trim(); if (!value) return; state.chat.push({ from: "user", text: value, time: "Now" }); state.chatLoading = true; render(); setTimeout(() => { state.chat.push({ from: "bot", text: botAnswer(value), time: "Now" }); state.chatLoading = false; render(); document.getElementById("chatHistory")?.scrollTo(0, 99999) }, 650) }
            function exportReport() { const { key, rows } = reportData(); const cols = Object.keys(rows[0] || data[key][0] || {}); const csv = [cols.join(","), ...rows.map(r => cols.map(c => `"${String(r[c] ?? "").replaceAll('"', '""')}"`).join(","))].join("\r\n"); const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); link.download = `memoria-${key}-report.csv`; link.click(); URL.revokeObjectURL(link.href); toast("Filtered report exported as CSV.") }
            document.addEventListener("click", e => { const target = e.target instanceof Element ? e.target : null; const result = target?.closest("[data-grave-details]"); if (result) { state.selectedRecord = result.dataset.graveDetails; go("graveDetails"); return } const person = target?.closest("[data-find-person]"); if (person) { const d = data.deceased.find(x => x.name === person.dataset.findPerson); if (d) { state.selectedRecord = d.id; go("graveDetails") } } });
            render();
        })();
    </script>
</body>

</html>
